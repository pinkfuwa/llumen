name: Check Licenses

on:
  pull_request:
    paths:
      - "backend/Cargo.lock"
      - "frontend/pnpm-lock.yaml"
  push:
    paths:
      - "backend/Cargo.lock"
      - "frontend/pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-push:
    name: Check push source
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.filter.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
      - name: Check for an existing PR run
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/skip-duplicate-ci.sh

  check-backend-licenses:
    name: ${{ github.event_name == 'push' && 'Check backend THIRDPARTY.toml (push)' || 'Check backend THIRDPARTY.toml' }}
    needs: check-push
    if: ${{ !cancelled() && needs.check-push.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-bundle-licenses
        run: cargo install cargo-bundle-licenses --version 2.0.0

      - name: Generate licenses
        working-directory: ./backend
        run: cargo bundle-licenses --format toml --output THIRDPARTY.toml.new

      - name: Check if licenses are up-to-date
        working-directory: ./backend
        run: |
          if diff -q THIRDPARTY.toml THIRDPARTY.toml.new > /dev/null; then
            echo "✅ Backend THIRDPARTY.toml is up to date"
          else
            echo "❌ Backend THIRDPARTY.toml is out of date!"
            echo "Please run 'cd backend && cargo bundle-licenses --format toml --output THIRDPARTY.toml' and commit the changes."
            exit 1
          fi

  check-frontend-licenses:
    name: ${{ github.event_name == 'push' && 'Check frontend THIRDPARTY.txt (push)' || 'Check frontend THIRDPARTY.txt' }}
    needs: check-push
    if: ${{ !cancelled() && needs.check-push.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install

      - name: Generate licenses
        working-directory: ./frontend
        run: pnpm generate-licenses

      - name: Check if licenses are up-to-date
        working-directory: ./frontend
        run: |
          if git diff --exit-code THIRDPARTY.txt; then
            echo "✅ Frontend THIRDPARTY.txt is up to date"
          else
            echo "❌ Frontend THIRDPARTY.txt is out of date!"
            echo "Please run 'cd frontend && pnpm generate-licenses' and commit the changes."
            exit 1
          fi
