name: Release Docker

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Cache Cargo build artifacts
        uses: actions/cache@v5
        id: cargo_cache
        with:
          path: .build-cache
          key: docker-cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock', 'backend/**/Cargo.toml', 'backend/.cargo/config.toml', 'package/Dockerfile', 'package/install-zig.sh') }}-deep-research

      - name: Restore Cargo cache mounts
        uses: reproducible-containers/buildkit-cache-dance@ca04d1a0e0018e28a060ec9f87518ddc453b4460 # v3.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              ".build-cache/target": {"target": "/compiler/target", "id": "target"},
              ".build-cache/registry": "/usr/local/cargo/registry",
              ".build-cache/git": "/usr/local/cargo/git"
            }
          skip-extraction: ${{ steps.cargo_cache.outputs.cache-hit }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (with version tag)
        id: meta
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pinkfuwa/llumen
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Extract metadata (manual dispatch)
        id: meta-manual
        if: github.event_name == 'workflow_dispatch'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pinkfuwa/llumen
          tags: |
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./package/Dockerfile
          platforms: "linux/amd64,linux/arm64"
          push: true
          tags: ${{ steps.meta.outputs.tags || steps.meta-manual.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels || steps.meta-manual.outputs.labels }}
          build-args: |
            FEATURES=deep-research
          cache-from: type=gha
          cache-to: type=gha,mode=max
