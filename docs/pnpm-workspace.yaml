allowBuilds:
  core-js: true
  core-js-pure: true
minimumReleaseAgeExclude:
  # Allow this security update during pnpm's 24-hour release delay.
  - http-cache-semantics@4.3.0
overrides:
  serialize-javascript: '>=7.1.3'
  source-map-js: '>=1.2.2'
  proxy-addr: '>=2.0.8 <3'
  compression: '>=1.8.2 <2'
  postcss-selector-parser: '>=7.1.6 <8'
  tinypool: '>=2.1.2 <3'
  body-parser: '>=1.20.9 <2'
  minimatch: '>=10.2.3'
  ajv: '>=8.18.0'
  qs: '>=6.16.0'
  glob: '>=11.0.0'
  svgo: 3.3.5
  path-to-regexp: '>=0.1.13'
  yaml: '>=2.8.3'
  brace-expansion: '>=5.0.12'
  picomatch: '>=4.0.4'
  lodash: '>=4.18.0'
  'js-yaml@<4': 3.15.2
  'js-yaml@>=4': '>=5.4.1'
  webpack-dev-server: '>=5.2.6 <6'
  shell-quote: '>=1.11.0'
  websocket-driver: '>=0.7.5'
  http-proxy-middleware: '>=2.0.10 <3'
  follow-redirects: '>=1.16.1'
  launch-editor: '>=2.14.2'
  postcss: '>=8.5.23'
  uuid: '>=11.1.1'
  fast-uri: '>=4.2.3'
  http-cache-semantics: '>=4.2.1 <5'
  '@babel/core': '>=7.29.1 <8'
  '@babel/plugin-transform-modules-systemjs': '>=7.29.4 <8'
